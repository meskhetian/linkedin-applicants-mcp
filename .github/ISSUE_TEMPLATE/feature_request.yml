name: Feature request
description: Suggest an improvement. Note the project is read-only on LinkedIn by design.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Two things are out of scope and will be closed:

        - **Anything that writes on LinkedIn**: rating, notes, messaging, InMail, connection requests, editing
          jobs, applying. This server stays read-only.
        - **Anything that makes the pacing more aggressive by default**, bypasses checkpoints or CAPTCHAs,
          rotates proxies or hides the browser. The point of the project is to be slow and honest.

        Improvements to data quality, exports, the queue, the dashboard, the debug tools, robustness against
        LinkedIn changes, documentation and tests are very welcome.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not add any write action on LinkedIn and does not loosen the pacing defaults.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you doing by hand today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? Which tool(s) would change or be added? What would the output look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Applicant / profile data extraction
        - Exports (CSV / JSON / new formats)
        - Queue, pacing, scheduling
        - Local dashboard
        - Debug tools / resilience to LinkedIn changes
        - MCP tools / prompts
        - Documentation
        - Other
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this in a PR.
